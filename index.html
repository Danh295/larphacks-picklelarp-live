<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PickleLARP Live</title>
<style>
:root{--ink:#0a1020;--lime:#d4ff1f;--red:#ff2d3d;--blue:#2b6bff;--paper:#f4efe0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070f;color:#fff;font-family:Impact,"Arial Narrow Bold","Helvetica Neue",Arial,sans-serif;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;overflow:hidden}
canvas{width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:absolute;top:12px;left:12px;display:flex;gap:8px;pointer-events:none}
.stat{background:rgba(10,16,32,.82);border-left:5px solid var(--lime);padding:6px 12px;min-width:92px}
.stat small{display:block;font:600 11px/1 system-ui,sans-serif;letter-spacing:.12em;color:#9fb0d0;text-transform:uppercase}
.stat b{font-size:28px;letter-spacing:.02em;font-weight:400}
.stat.bad{border-left-color:var(--red)}
#lower{position:absolute;left:0;bottom:46px;transform:translateX(-110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none;max-width:90%}
#lower.show{transform:translateX(0)}
#lower .a{background:var(--lime);color:var(--ink);padding:6px 18px;font-size:22px;letter-spacing:.03em}
#lower .b{background:rgba(10,16,32,.92);padding:8px 18px;font-size:34px;border-bottom:4px solid var(--lime)}
#big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(36px,9vw,120px);line-height:1;text-shadow:0 4px 0 #000,0 0 30px rgba(0,0,0,.8);pointer-events:none;opacity:0;padding:0 20px}
#big.show{animation:pop 2.6s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-4deg)}10%{opacity:1;transform:scale(1.08) rotate(-2deg)}85%{opacity:1}100%{opacity:0;transform:scale(1)}}
#ticker{position:absolute;left:0;right:0;bottom:0;height:38px;background:var(--ink);border-top:3px solid var(--lime);overflow:hidden;white-space:nowrap;pointer-events:none}
#ticker div{display:inline-block;padding-left:100%;line-height:35px;font-size:19px;letter-spacing:.04em;animation:tick 70s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
#ticker span{color:var(--lime);margin:0 10px}
#bar{position:fixed;right:10px;top:10px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
#bar button,#bar input{font:600 12px system-ui,sans-serif;background:rgba(10,16,32,.9);color:#fff;border:1px solid #3a4a70;padding:7px 10px;cursor:pointer}
#bar input{width:130px;cursor:text}
#bar button.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}
#hint{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--lime);color:var(--ink);padding:8px 16px;font:700 15px system-ui,sans-serif;display:none;text-align:center}
#hint.show{display:block}
#intro{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 30% 20%,#12306a,#05070f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#intro h1{margin:0;font-size:clamp(44px,9vw,110px);line-height:.95;letter-spacing:.02em}
#intro h1 em{color:var(--lime);font-style:normal}
#intro p{margin:0;font:500 clamp(14px,2vw,20px) system-ui,sans-serif;color:#b9c6e4;max-width:640px}
#intro button{font:400 30px Impact,sans-serif;letter-spacing:.05em;background:var(--lime);color:var(--ink);border:0;padding:14px 38px;cursor:pointer;margin-top:8px}
#status{font:600 13px system-ui,sans-serif;color:#9fb0d0;min-height:18px}
#keys{font:12px system-ui,sans-serif;color:#6f7fa3}
</style>
</head>
<body>
<div id="intro">
  <h1>PICKLE<em>LARP</em><br>LIVE</h1>
  <p>You don't need to be good at pickleball. You just need to look like it. Webcam only. No ball required.</p>
  <button id="start">GO LIVE</button>
  <div id="status"></div>
  <div id="keys">Stand back so your whole body is in frame. Test keys: S swing · J jumbotron · U sad clap</div>
</div>

<div id="bar">
  <input id="name" placeholder="Your pro name" maxlength="24">
  <button id="btnHonest" title="Show the real, uninflated swing speed">Honest mode: off</button>
  <button id="btnSkel" class="on">Skeleton</button>
</div>

<div id="stage">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="stat"><small>DUPR</small><b id="dupr">2.10</b></div>
    <div class="stat"><small>Top speed</small><b id="top">0 mph</b></div>
  </div>
  <div id="hint"></div>
  <div id="lower"><div class="a" id="lowA">YOU · WORLD NO. 1 (SELF-REPORTED)</div><div class="b" id="lowB">147 mph</div></div>
  <div id="big"></div>
  <div id="ticker"><div id="tickTxt"></div></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
